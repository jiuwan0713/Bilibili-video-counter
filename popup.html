<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B站观看统计</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </span>
        <div class="brand-text">
          <h1>B站观看统计</h1>
          <p>只记录在本机的观看</p>
        </div>
      </div>
      <button class="icon-btn" id="refresh" type="button" title="刷新数据" aria-label="刷新数据">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>

    <section class="cards" aria-label="观看数量">
      <article class="card card--today">
        <span class="card-label">今天</span>
        <div class="card-value"><strong id="today-count">0</strong><span class="unit">个</span></div>
        <span class="card-sub" id="today-time">0 分钟</span>
      </article>
      <article class="card">
        <span class="card-label">本周</span>
        <div class="card-value"><strong id="week-count">0</strong><span class="unit">个</span></div>
        <span class="card-sub" id="week-time">0 分钟</span>
      </article>
      <article class="card">
        <span class="card-label">本月</span>
        <div class="card-value"><strong id="month-count">0</strong><span class="unit">个</span></div>
        <span class="card-sub" id="month-time">0 分钟</span>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>最近 7 天</h2>
        <span class="panel-note" id="week-summary">共 0 个</span>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>今天看的</h2>
        <span class="panel-note" id="today-note"></span>
      </div>
      <ul class="recent" id="recent"></ul>
    </section>

    <footer class="footer">
      <label class="switch">
        <input type="checkbox" id="repeat-toggle">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-text">重复观看也计数</span>
      </label>
      <button class="ghost-btn" id="clear" type="button">清空数据</button>
    </footer>
  </div>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
